<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>项目组管理｜广州感恩连接行动包</title><link rel="stylesheet" href="style.css"><style>main{max-width:980px;padding:30px 24px 70px}.panel{background:white;border:1px solid #e5dbe9;border-radius:20px;padding:26px;margin:24px 0}.panel h2{font-size:28px}.row{padding:15px 0;border-bottom:1px solid #eee;line-height:1.7}.row small{display:block;color:#766a7a}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:14px 0}.status{min-height:25px;color:#654580}.narrow{max-width:520px}button.secondary{background:#eee3f2;color:#51356d}#catalog-list button{margin-left:12px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid #eee;vertical-align:top}th{background:#f5eef8;color:#3d2b47}td:nth-child(5){white-space:nowrap}button:disabled{opacity:.55;cursor:not-allowed}header{color:white}</style></head><body>
<header><a href="./"><img src="media/guangzhou/landz-logo.png" alt="LANDZ 丽兹行"></a><nav><a href="./">返回工作台</a></nav></header>
<main><h1 style="font-size:42px">项目组管理</h1><p>查看主推需求与伙伴反馈，维护礼物库。仅管理员邮箱可进入。</p><p id="status" class="status" role="status"></p>
<section id="login-panel" class="panel narrow"><h2>管理员登录</h2><form id="login-form"><label>管理员邮箱<input id="email" type="email" autocomplete="email" required></label><label>密码<input id="password" type="password" minlength="8" autocomplete="current-password" required></label><div class="actions"><button class="button primary">登录</button><button id="signup" class="button secondary" type="button">首次设置账号</button><button id="recover" class="button secondary" type="button">忘记密码</button></div></form><p>首次设置后，请在邮箱中完成验证，再回来登录。</p><div id="reset-panel" hidden><h3>重置密码</h3><p>先填写上方邮箱并点“忘记密码”。收到重置邮件后，复制邮件里按钮的链接地址，粘贴到下面；请勿把链接发给别人。</p><form id="reset-form"><label>邮件中的重置链接<input id="reset-link" type="url" placeholder="https://…/auth/v1/verify?token=…" required></label><label>新密码<input id="reset-password" type="password" minlength="8" autocomplete="new-password" required></label><button class="button primary">设置新密码并登录</button></form></div></section>
<div id="admin-panels" hidden><div class="actions"><button id="logout" class="button secondary" type="button">退出登录</button><button id="refresh" class="button" type="button">刷新数据</button></div>
<section class="panel"><h2>面见礼物需求表</h2><p>仅 BP 管理账号可查看。登记后刷新即可同步；下载文件包含登记明细和按礼物汇总的份数。</p><div class="actions"><button id="download-requests" class="button primary" type="button" disabled>下载 Excel 需求表</button></div><p id="request-count" class="status" role="status"></p><div id="requests" class="table-wrap"></div></section>
<section class="panel"><h2>伙伴反馈</h2><div id="feedback"></div></section>
<section class="panel"><h2>礼物库维护</h2><p>可修改单款礼物，或上传 CSV／Excel 整表替换。导入前会检查必填字段与重复编号。</p><div class="actions"><button id="download" class="button secondary" type="button">下载当前 CSV</button></div><form id="upload-form"><label>选择 CSV 或 Excel 文件<input id="catalog-file" type="file" accept=".csv,.xlsx,.xls" required></label><button class="button primary">检查并发布</button></form><p id="catalog-status" class="status" role="status"></p><div id="catalog-list"></div></section>
</div></main><footer>LANDZ · 广州感恩连接行动包</footer><script src="vendor/xlsx.full.min.js" defer></script><script src="admin.js" defer></script></body></html>
